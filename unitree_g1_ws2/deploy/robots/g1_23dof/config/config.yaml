domain_id: 0
mode_machine: 4

FSM:
  _: # enabled fsms
    Passive:
      id: 1
    FixStand:
      id: 2
    Velocity:
      id: 3
      type: Velocity
    Mimic_Dance_102:
      id: 101
      type: Mimic
    WBC:
      id: 10
      type: WBC
    UFO:
      id: 102
      type: UFO

  Passive:
    transitions: 
      FixStand: LT + up.on_pressed
      UFO: LT + Y.on_pressed
    deploy_file: config/state/passive.yaml

  FixStand:
    transitions: 
      Passive: LT + B.on_pressed
      Velocity: RB + X.on_pressed
      UFO: LT + Y.on_pressed
    deploy_file: config/state/fix_stand.yaml

  Velocity:
    transitions:
      Mimic_Dance_102: LT + down.on_pressed
      WBC: RB + up.on_pressed
      UFO: LT + Y.on_pressed
      FixStand: LT + up.on_pressed
    deploy_file: config/policy/unitree_g1_23dof_velocity/params/deploy.yaml

  Mimic_Dance_102:
    transitions: 
      Velocity: RB + X.on_pressed
    deploy_file: config/policy/mimic/dance_102/params/deploy.yaml
  
  WBC:
    transitions:
      Velocity: RB + X.on_pressed
    deploy_file: config/policy/wbc/deploy.yaml

  UFO:
    transitions:
      Passive: LT + B.on_pressed
      FixStand: LT + up.on_pressed
      Velocity: RB + X.on_pressed
    deploy_file: config/policy/ufo/deploy.yaml
