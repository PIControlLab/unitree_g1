schema_version: 2
robot_profile: config/robot/g1_23dof.yaml

timing:
  policy_dt: 0.02
  run_first_step_on_enter: false

joints:
  joint_names:
    [left_hip_pitch_joint, right_hip_pitch_joint, waist_yaw_joint,
     left_hip_roll_joint, right_hip_roll_joint,
     left_shoulder_pitch_joint, right_shoulder_pitch_joint,
     left_hip_yaw_joint, right_hip_yaw_joint,
     left_shoulder_roll_joint, right_shoulder_roll_joint,
     left_knee_joint, right_knee_joint,
     left_shoulder_yaw_joint, right_shoulder_yaw_joint,
     left_ankle_pitch_joint, right_ankle_pitch_joint,
     left_elbow_joint, right_elbow_joint,
     left_ankle_roll_joint, right_ankle_roll_joint,
     left_wrist_roll_joint, right_wrist_roll_joint]
  default_joint_pos:
    [-0.302, -0.319, 0.00124, 0.000442, 0.00489, 0.202, 0.209, 0.00796,
     0.00546, 0.203, -0.199, 0.669, 0.671, -0.00489, 0.00793, -0.369,
     -0.359, 0.594, 0.61, 0.00258, -0.00029, 0.155, -0.154]

control:
  mode: 1
  stiffness:
    [40.2, 40.2, 40.2, 99.1, 99.1, 14.3, 14.3, 40.2, 40.2, 14.3, 14.3,
     99.1, 99.1, 14.3, 14.3, 28.5, 28.5, 14.3, 14.3, 28.5, 28.5, 14.3, 14.3]
  damping:
    [2.56, 2.56, 2.56, 6.31, 6.31, 0.907, 0.907, 2.56, 2.56, 0.907, 0.907,
     6.31, 6.31, 0.907, 0.907, 1.81, 1.81, 0.907, 0.907, 1.81, 1.81, 0.907, 0.907]
  effort_limit:
    [139, 139, 88, 139, 139, 25, 25, 88, 88, 25, 25, 139, 139, 25, 25,
     50, 50, 25, 25, 50, 50, 25, 25]

model:
  policy:
    files: [config/policy/mimic/dance_102/exported/policy.onnx]

reference:
  manifest: config/policy/mimic/dance_102/reference/reference.yaml
  start_time: 0.0
  end_time: 28.0

observations:
  obs:
    blocks:
      - layout: term_major
        terms:
          - {source: reference_joint_state}
          - {source: reference_anchor_orientation_6d}
          - {source: base_ang_vel}
          - {source: joint_pos_rel}
          - {source: joint_vel}
          - {source: last_action}

actions:
  type: joint_position
  raw_action_scale: 1.0
  raw_action_clip: null
  action_target_scale:
    [0.548, 0.548, 0.548, 0.351, 0.351, 0.439, 0.439, 0.548, 0.548, 0.439,
     0.439, 0.351, 0.351, 0.439, 0.439, 0.439, 0.439, 0.439, 0.439, 0.439,
     0.439, 0.439, 0.439]
  add_default_joint_pos: true
  position_clip: null
  effort_limit_mode: none

handover:
  position_blend_duration: 0.0

safety:
  bad_orientation:
    enabled: true
    threshold_rad: 1.0
    warmup_steps: 0
    target_state: Passive
